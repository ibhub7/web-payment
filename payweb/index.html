<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay</title><meta name="theme-color" content="#101828">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef1f6;--ink:#101828;--mut:#5b6478;--card:#fff;--line:#dde2ec;--acc:#3b34d6;--acc2:#e8e7fb;--ok:#12805c;--err:#c0392b;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0c111b;--ink:#eef1f8;--mut:#98a2b8;--card:#151c2b;--line:#263049;--acc:#8b86ff;--acc2:#1f2142;--ok:#38c795;--err:#ff7b6b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 28px/1.15 'Bricolage Grotesque',Inter,sans-serif;margin:8px 0 4px;letter-spacing:-.5px}
h2{font:700 15px 'Bricolage Grotesque',Inter,sans-serif;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;text-align:left;font:inherit;cursor:pointer}
.chip b{display:block;font:800 20px 'Bricolage Grotesque',sans-serif}.chip span{color:var(--mut);font-size:13px}
.chip[aria-pressed=true]{border-color:var(--acc);background:var(--acc2)}
input,button.go,a.btn{font:inherit}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
label small{font-weight:400;color:var(--mut)}
input[type=text],input[type=number],input[type=tel]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ticket{position:relative;text-align:center;padding:22px 16px 18px}
.ticket:before,.ticket:after{content:"";position:absolute;top:calc(100% - 78px);width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket:before{left:-10px}.ticket:after{right:-10px}
.amt{font:800 40px 'Bricolage Grotesque',sans-serif;letter-spacing:-1px}
#qr{display:inline-block;padding:10px;background:#fff;border-radius:12px;margin:10px 0}#qr img,#qr canvas{display:block}
.row{display:flex;gap:8px;margin-top:6px}
.btn,button.go{flex:1;display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.btn.alt{background:var(--acc2);color:var(--acc)}
button.go:disabled{opacity:.55;cursor:wait}
.upi{font:500 13px ui-monospace,monospace;color:var(--mut);word-break:break-all}
.note{background:var(--acc2);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0 0}
.msg{margin-top:12px;padding:12px;border-radius:12px;display:none;font-weight:500}
.msg.err{display:block;background:#c0392b1a;color:var(--err)}.msg.ok{display:block;background:#12805c1a;color:var(--ok)}
.bots a{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.bots a:first-of-type{border-top:0}.bots span{color:var(--mut);font-weight:400}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.chip{transition:border-color .15s,background .15s}}
</style></head>
<body><main id="app">
<h1 id="title"></h1><p class="sub" id="sub"></p>
<section class="card" id="pick"></section>
<section class="card ticket" id="qrBox" hidden>
  <div class="sub" style="margin:0">Scan with any UPI app</div>
  <div class="amt" id="amtTxt"></div>
  <div id="qr"></div>
  <div class="upi" id="upiTxt"></div>
  <div class="row"><a class="btn" id="upiBtn" href="#">Open UPI app</a><button class="btn alt" id="copyBtn" type="button">Copy UPI ID</button></div>
  <div class="note">Amount is already filled. Pay exactly this amount. The amount is locked in the QR.</div>
</section>

<section class="card bots" id="botList" hidden><h2>Pay for a bot</h2></section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
